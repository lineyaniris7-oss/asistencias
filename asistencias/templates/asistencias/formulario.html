<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Asistencia</title>
    {% include 'asistencias/estilos.html' %}
</head>

<body>

<h1>Asistencia</h1>

<form method="POST">

    {% csrf_token %}

    <p>
        <label>Nombres:</label><br>
        <input
            type="text"
            name="nombres"
            value="{{ asistencia.nombres|default:'' }}"
            required
        >
    </p>

    <p>
        <label>Apellidos:</label><br>
        <input
            type="text"
            name="apellidos"
            value="{{ asistencia.apellidos|default:'' }}"
            required
        >
    </p>

    <p>
        <label>Tipo de documento:</label><br>
        <input
            type="text"
            name="tipo_documento"
            value="{{ asistencia.tipo_documento|default:'' }}"
            required
        >
    </p>

    <p>
        <label>Documento:</label><br>
        <input
            type="text"
            name="documento"
            value="{{ asistencia.documento|default:'' }}"
            required
        >
    </p>

    <p>
        <label>Whatsapp:</label><br>
        <input
            type="text"
            name="whatsapp"
            value="{{ asistencia.whatsapp|default:'' }}"
            required
        >
    </p>

    <p>
        <label>Fecha:</label><br>
        <input
            type="date"
            name="fecha"
            value="{{ asistencia.fecha|date:'Y-m-d' }}"
            required
        >
    </p>

    <p>
        <label>Asistio:</label><br>
        <input
            type="checkbox"
            name="asistio"
            {% if asistencia.asistio %}checked{% endif %}
        >
    </p>

    
    <button type="submit">
        Guardar
    </button>

</form>

<br>

<a href="/asistencias/lista/">
    Ver asistencias
</a>

</body>

</html>
