<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistencias</title>
    {% include 'asistencias/estilos.html' %}
</head>

<body>

<header class="barra">
    <p>Hola, <strong>{{ user.username }}</strong></p>
    <a href="/usuarios/logout/">Cerrar sesión</a>
</header>

<h1>Lista de asistencias</h1>

<a class="boton-nuevo" href="/asistencias/">Nueva asistencia</a>

{% for asistencia in asistencias %}

    <article class="item">

        <h3>{{ asistencia.nombres }}</h3>

        <div class="acciones">
            <a href="/asistencias/detalle/{{ asistencia.id }}/">Ver</a>
            <a href="/asistencias/editar/{{ asistencia.id }}/">Editar</a>
            <a href="/asistencias/eliminar/{{ asistencia.id }}/">Eliminar</a>
        </div>

    </article>

{% empty %}

    <p class="vacio">No hay asistencias.</p>

{% endfor %}

</body>

</html>
